services:
  sit-aw-anchoring:
    #env_file: 
    #  - path: ./env-jazzy
    #    required: true
    build:
      context: .
      dockerfile: Dockerfile-jazzy
    image: ${IMAGE_NAME}:${TAG} #ghcr.io/convince-project/sit-aw-anchoring:0.3.0-jazzy
    container_name: sit_aw_anchoring_030_jazzy_ctr
    #network-mode: host
    environment: 
     - DISPLAY=:0
    ipc: host
    volumes:
      - ${ROS_WS_VOLUME}:/home/${USERNAME}/sit-aw-anchoring/jazzy_ws
      - ${TQL_VOLUME}:/tmp/tql
      - ${DT_VOLUME}:/tmp/dt
      #- ${HISTFILE}:/home/${USERNAME}/.bash_history
      - /tmp/.X11-unix:/tmp/.X11-unix
      - /dev/dri:/dev/dri
      - ./entrypoint.sh:/entrypoint.sh
    entrypoint: /entrypoint.sh