anchoring_process:
  ros__parameters:
    typedb_server_addr: "localhost:1729"
    entity_managers:
      - "block"
      - "gripper"
    block:
      plugin: "anchoring_skrawl_plugins::BlockManager"
    gripper:
      plugin: "anchoring_skrawl_plugins::GripperManager"
    knowledge_domains:
      - "SkrawlMoMa"
    SkrawlMoMa:
      database_name: "skrawl-mobile-manipulation-2604"
      pkg: "anchoring_skrawl_plugins"
      schemas:
        - "skrawl/schemas/udul.tql"
        - "skrawl/schemas/skrawl-spatial.tql"
        - "skrawl/schemas/skrawl-quality.tql"
        - "skrawl/schemas/skrawl-dt.tql"
        - "skrawl/schemas/skrawl-bops.tql"
        - "skrawl/schemas/skrawl-agents.tql"
        - "skrawl/schemas/skrawl-skills.tql"
        - "skrawl/schemas/skrawl-spatial-rules.tql"
        - "skrawl/schemas/skrawl-skills-rules.tql"

